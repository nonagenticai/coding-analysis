services:
  coding-analysis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coding-analysis

    environment:
      SERVICE_NAME: coding-analysis
      VERSION: 1.0.0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      PORT: 8688
      # DEFAULT_TENANT_ID is deliberately UNSET. Tenant identity has been a uuid7
      # since the 2026-04-29 Keycloak migration and `tenant_id` is a native uuid
      # column since migration 0005, so the old "n8n-dev" fallback is not merely
      # the stale label of a real tenant (see tests/unit/test_no_tenant_literal.py)
      # — it is now unstorable, and would surface as a 22P02 from inside a graph
      # write rather than as a refusal at the door. Unset means the SDK reports
      # None, the trusted-network bypass grants no tenant, and a credential-less
      # caller gets a clean 401. Set it to a real tenant uuid if you need one.
      ENABLE_AUTH: "true"
      ENABLE_DOCS: "true"

      # Database
      DATABASE_URL: postgresql+psycopg://coding:${POSTGRES_PASSWORD:-coding}@postgres:5432/code_graph
      PGBOUNCER_URL: postgresql+psycopg://coding:${POSTGRES_PASSWORD:-coding}@pgbouncer:6432/code_graph

      # Redis
      REDIS_URL: redis://code-graph-redis:6379/0

      # OpenTelemetry
      OTLP_TRACES_ENDPOINT: http://grafana-agent:4318/v1/traces
      OTEL_SERVICE_NAME: coding-analysis
      OTEL_SDK_DISABLED: "false"

    ports:
      - "0.0.0.0:8688:8688"

    networks:
      - workflow-system-network

    restart: unless-stopped


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8688/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  workflow-system-network:
    driver: bridge
